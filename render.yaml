services:
  - type: web
    name: kenyawatch-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node Backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kenyawatch-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false   # Set this manually in Render dashboard → Environment

databases:
  - name: kenyawatch-db
    plan: free
    databaseName: kenyawatch
    user: kenyawatch
